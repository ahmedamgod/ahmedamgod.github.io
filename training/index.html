<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="robots" content="noindex, nofollow">
  <title>HSE Training Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=10">
  <script src="config.js?v=10"></script>
  <script>
    // Firebase يتحمل بس لو الإعدادات موجودة
    if (window.HSE_CONFIG && window.HSE_CONFIG.firebase) {
      ["app", "auth", "firestore"].forEach(function (m) {
        document.write('<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-' + m + '-compat.js"><\/script>');
      });
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="store.js?v=10"></script>
  <script src="idocr.js?v=10"></script>
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2.5 20 6v5.5c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="m8.5 12 2.3 2.3 4.8-5"/></svg>
      </span>
      <div>
        <div class="brand-title">متابعة التدريب</div>
        <div class="brand-sub" id="siteName"></div>
      </div>
    </div>
    <div class="who">
      <span id="whoName"></span>
      <button class="btn-ghost small" id="logoutBtn" type="button">خروج</button>
    </div>
  </header>

  <div class="demo-banner" id="demoBanner" hidden>
    وضع التجربة: البيانات محفوظة على الجهاز ده بس. عشان تشتغل أونلاين مع كل الأوفيسرز شوف ملف SETUP.md
  </div>

  <main id="app" class="container"></main>

  <nav class="bottomnav" id="bottomnav" hidden></nav>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button class="icon-btn" id="modalClose" type="button" aria-label="إغلاق">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="printArea"></div>

  <script src="app.js?v=10"></script>
</body>
</html>
