<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>رحلة · خطوة كل يوم</title>
  <meta name="description" content="رحلة — تطبيقك لتنظيم عباداتك وعاداتك وصحتك ومشاعرك، خطوة صغيرة كل يوم.">
  <meta name="theme-color" content="#FFF9EB">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="رحلة">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&family=Marhey:wght@600;700&display=swap" rel="stylesheet">
  <style>
    #splash { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #FFFDF4, #F7EED6); transition: opacity .45s; font-family: system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) { #splash { background: radial-gradient(circle at 50% 40%, #2A3323, #161B13); } .splash-tag { color: #C9DAA6 !important; } }
    #splash.hide { opacity: 0; pointer-events: none; }
    .splash-in { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 24px; }
    .splash-logo { width: min(230px, 58vw); height: auto; animation: splash-in .7s cubic-bezier(.2,.8,.2,1) both, splash-float 3.2s ease-in-out .7s infinite; filter: drop-shadow(0 14px 24px rgba(83,107,60,.25)); }
    .splash-tag { margin: 4px 0 14px; color: #536B3C; font-weight: 700; font-size: 1.05rem; opacity: 0; animation: splash-fade .6s .35s forwards; }
    .splash-bar { width: 120px; height: 4px; border-radius: 4px; background: rgba(145,170,98,.25); overflow: hidden; }
    .splash-bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #91AA62; animation: splash-load 1.2s ease-in-out infinite; }
    .splash-help { margin-top: 18px; color: #6F7765; font-size: .9rem; }
    .splash-help button { margin-top: 6px; border: 0; border-radius: 999px; padding: 10px 22px; background: #91AA62; color: #fff; font: inherit; font-weight: 700; }
    @keyframes splash-in { from { opacity: 0; transform: scale(.85); } }
    @keyframes splash-float { 50% { transform: translateY(-6px); } }
    @keyframes splash-fade { to { opacity: 1; } }
    @keyframes splash-load { 0% { transform: translateX(160%); } 100% { transform: translateX(-260%); } }
  </style>
  <link rel="preload" href="icons/logo-full.png" as="image">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // لو Chrome شغال على "إصدار سطح المكتب" على موبايل، الصفحة بتتعرض بعرض كمبيوتر وكل حاجة بتصغر.
    // هنا بنكبّر التطبيق عشان يملا شاشة الموبايل زي أي تطبيق.
    (function () {
      function fit() {
        var el = document.documentElement;
        var touch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
        var sw = screen.width, w = window.innerWidth;
        var z = touch && sw && w > sw * 1.25 ? w / sw : 1;
        el.style.zoom = z === 1 ? '' : z.toFixed(3);
        el.style.setProperty('--z', z.toFixed(3));
      }
      fit();
      addEventListener('resize', fit);
      addEventListener('orientationchange', function () { setTimeout(fit, 300); });
    })();
  </script>
</head>
<body>
  <!-- فلاتر الألوان المائية المشتركة لكل الرسومات -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" result="d"/>
        <feGaussianBlur in="d" stdDeviation="0.8"/>
      </filter>
      <filter id="wcs" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FCE6C8"/><stop offset=".6" stop-color="#FFF4DA"/><stop offset="1" stop-color="#EEF3DF"/>
      </linearGradient>
    </defs>
  </svg>

  <div id="splash">
    <div class="splash-in">
      <img src="icons/logo-full.png" width="230" height="230" alt="رحلة" class="splash-logo">
      <p class="splash-tag">كل يوم خطوة صغيرة 🌿</p>
      <div class="splash-bar"><i></i></div>
      <div class="splash-help" hidden>
        <p>التحميل بياخد وقت أطول من العادي…</p>
        <button type="button" id="splash-reload">إعادة تحميل</button>
      </div>
    </div>
  </div>
  <script>
    // لو شاشة الفتح طوّلت: زرار بيمسح الملفات القديمة ويفتح التطبيق من جديد
    (function () {
      var t = setTimeout(function () { var h = document.querySelector('.splash-help'); if (h && document.getElementById('splash')) h.hidden = false; }, 7000);
      document.getElementById('splash-reload').onclick = async function () {
        this.textContent = 'لحظة…';
        try {
          var regs = await (navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : []);
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
          var keys = await caches.keys();
          await Promise.all(keys.filter(function (k) { return k.indexOf('rehla') === 0; }).map(function (k) { return caches.delete(k); }));
        } catch (e) {}
        location.reload();
      };
    })();
  </script>

  <div id="scene" aria-hidden="true"></div>
  <a href="#main" class="skip">انتقل للمحتوى</a>
  <main id="main" tabindex="-1"></main>
  <nav id="nav" class="bottom-nav" aria-label="التنقل الرئيسي" hidden></nav>
  <div id="toasts" aria-live="polite"></div>

  <noscript><p style="padding:24px;text-align:center">رحلة محتاجة JavaScript عشان تشتغل.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
